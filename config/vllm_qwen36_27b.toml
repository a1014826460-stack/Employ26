[server]
host = "127.0.0.1"
port = 8101
startup_timeout_seconds = 1800
request_timeout_seconds = 600

[wsl]
distro = "Ubuntu-24.04"
vllm_env = "/home/lin/llm-env"
vllm_bin = "/home/lin/llm-env/bin/vllm"

[model]
name = "/home/lin/models/Qwen3.6-27B-Uncensored-Balanced/Qwen3.6-27B-Uncensored-HauhauCS-Balanced-Q4_K_P.gguf"
windows_dir = ""
wsl_dir = "/home/lin/models/Qwen3.6-27B-Uncensored-Balanced/Qwen3.6-27B-Uncensored-HauhauCS-Balanced-Q4_K_P.gguf"

[vllm]
enable_reasoning = false
dtype = "half"
max_model_len = 4096
gpu_memory_utilization = 0.90
max_num_seqs = 12
enable_prefix_caching = true
safetensors_load_strategy = "prefetch"
trust_remote_code = true
reasoning_parser = "qwen3"
enable_auto_tool_choice = true
tool_call_parser = "qwen3_xml"
extra_args = []

[chat]
temperature = 0.0
max_tokens = 256
enable_thinking = false
system_prompt = "你是职业细类选择器。你只能从给定候选中选一个最合适的职业细类，并且必须输出 JSON。"

